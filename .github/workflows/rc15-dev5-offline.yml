name: AutoXY RC15 dev5 offline review
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vision dependencies
        run: python -m pip install -r requirements-vision.txt
      - name: Compile controller and scripts
        run: python -m compileall -q src scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
