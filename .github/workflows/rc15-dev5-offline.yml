name: AutoXY RC16 Dev1 offline qualification
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact RC16 vision wheels
        run: python -m pip install --only-binary=:all: -r requirements-vision-rc16.txt
      - name: Vision ABI functional smoke test
        run: |
          python -c 'import cv2,numpy; import importlib.metadata as im; data=numpy.zeros((4,4,3),dtype=numpy.uint8); assert cv2.cvtColor(data,cv2.COLOR_BGR2GRAY).shape==(4,4); assert numpy.__version__=="1.26.4"; assert im.version("opencv-python-headless")=="4.11.0.86"'
      - name: Compile full source and tests
        run: python -m compileall -q src scripts tests
      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
