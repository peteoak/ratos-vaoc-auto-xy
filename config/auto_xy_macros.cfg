# AutoXY v0.5.0 RC13: source-managed runtime macros. DO NOT duplicate in printer.cfg.
# Imported by [include auto_xy_macros.cfg] in auto_xy.cfg.
# All protected-print recovery checks and RatOS offsets remain managed by the existing controller.

# ---- Core user controls and RatOS print hooks ----
[gcode_macro AUTO_XY_ON]
description: ENABLE Auto XY after bed heatsoak, before Beacon 170C probe (next print)
gcode:
    {% if printer.save_variables.variables.auto_xy_v2_fault|default(0)|int or printer.save_variables.variables.auto_xy_v2_in_progress|default(0)|int %}
        {action_raise_error("AUTO XY fault is latched; inspect and acknowledge before enabling")}
    {% endif %}
    {% if printer.save_variables.variables.auto_xy_v2_retry_available|default(0)|int %}
        {action_raise_error("Active-VAOC retry is pending. Use the Mainsail retry prompt AFTER the failed print has stopped, or dismiss and recover VAOC manually.")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=auto_xy_v2_measure_only VALUE=0
    SAVE_VARIABLE VARIABLE=auto_xy_v2_enabled VALUE=1
    {action_respond_info("AUTO XY ON: dual-tool independent IDEX calibrates; single-tool/COPY/MIRROR bypass.")}

# Community commissioning: verify alignment without writing saved nozzle offsets.
# Print will be rejected if measurements are outside tolerance, as requested.
[gcode_macro AUTO_XY_MEASURE_ONLY_ON]
description: Enable measure-only validation: no saved nozzle offset writes
gcode:
    {% if printer.save_variables.variables.auto_xy_v2_fault|default(0)|int or printer.save_variables.variables.auto_xy_v2_in_progress|default(0)|int %}
        {action_raise_error("AUTO XY fault is latched; recover before enabling measure-only")}
    {% endif %}
    {% if printer.save_variables.variables.auto_xy_v2_retry_available|default(0)|int %}
        {action_raise_error("Active-VAOC retry is pending; resolve it before enabling measure-only")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=auto_xy_v2_measure_only VALUE=1
    SAVE_VARIABLE VARIABLE=auto_xy_v2_enabled VALUE=1
    {action_respond_info("AUTO XY MEASURE ONLY ON: no offset writes; independent two-tool prints blocked if misaligned.")}

[gcode_macro AUTO_XY_REUSE_ON]
description: Opt in to skipping unchanged verified Auto XY calibration at next IDEX print
gcode:
    SAVE_VARIABLE VARIABLE=auto_xy_v2_reuse_enabled VALUE=1
    {action_respond_info("AUTO XY reuse ON: only a completed, still-homed, motors-enabled, temperature-compatible calibration may be reused. Otherwise normal calibration runs.")}

[gcode_macro AUTO_XY_REUSE_OFF]
description: Always measure again at next eligible two-tool print (safe default)
gcode:
    SAVE_VARIABLE VARIABLE=auto_xy_v2_reuse_enabled VALUE=0
    {action_respond_info("AUTO XY reuse OFF: normal calibration at every eligible print start.")}

[gcode_macro AUTO_XY_OFF]
description: BYPASS Auto XY completely (keep current calibrated offsets)
gcode:
    SAVE_VARIABLE VARIABLE=auto_xy_v2_enabled VALUE=0
    SAVE_VARIABLE VARIABLE=auto_xy_v2_measure_only VALUE=0
    {action_respond_info("AUTO XY OFF: no VAOC on future print starts; saved offsets unchanged. Existing faults must still be acknowledged after verification.")}

# One-click button in Mainsail's Macros panel. Mainsail shows this public
# gcode_macro automatically. The saved setting persists across restarts.
# A latched fault cannot be bypassed by toggling ON; OFF preserves offsets.
[gcode_macro AUTO_XY_TOGGLE]
description: Toggle Auto XY ON/OFF for NEXT print (OFF keeps current offsets)
gcode:
    {% set v = printer.save_variables.variables %}
    {% set currently_on = v.auto_xy_v2_enabled|default(0)|int %}
    {% if currently_on %}
        SAVE_VARIABLE VARIABLE=auto_xy_v2_enabled VALUE=0
        SAVE_VARIABLE VARIABLE=auto_xy_v2_measure_only VALUE=0
        {action_respond_info("AUTO XY OFF: calibration BYPASSED for future prints; saved RatOS offsets unchanged. Use AUTO_XY_STATUS to confirm.")}
    {% else %}
        {% if v.auto_xy_v2_fault|default(0)|int or v.auto_xy_v2_in_progress|default(0)|int %}
            {action_raise_error("AUTO XY cannot be enabled: unresolved safety fault/in-progress marker. Inspect the printer and saved offsets before AUTO_XY_ACKNOWLEDGE.")}
        {% endif %}
        {% if v.auto_xy_v2_retry_available|default(0)|int %}
            {action_raise_error("One-time active-VAOC retry pending: retry safely or dismiss and recover manually") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=auto_xy_v2_measure_only VALUE=0
        SAVE_VARIABLE VARIABLE=auto_xy_v2_enabled VALUE=1
        {action_respond_info("AUTO XY ON: calibration ENABLED for future prints. Use AUTO_XY_STATUS to confirm.")}
    {% endif %}

[gcode_macro AUTO_XY_STATUS]
description: Show Auto XY setting
gcode:
    {% set state = printer.save_variables.variables.auto_xy_v2_enabled|default(0)|int %}
    {% set v = printer.save_variables.variables %}
    {% set measure = printer.save_variables.variables.auto_xy_v2_measure_only|default(0)|int %}
    {% set reuse = printer.save_variables.variables.auto_xy_v2_reuse_enabled|default(0)|int %}
    {% set detail = "MEASURE ONLY: no saved nozzle offsets changed; eligible misaligned prints are blocked." if state and measure else "Calibration enabled for eligible dual-tool independent IDEX prints." if state else "Calibration bypassed; saved RatOS offsets unchanged." %}
    {action_respond_info("AUTO XY: " ~ ("ON" if state else "OFF") ~ "; FAULT=" ~ v.auto_xy_v2_fault|default(0)|int ~ "; IN_PROGRESS=" ~ v.auto_xy_v2_in_progress|default(0)|int ~ "; RETRY_AVAILABLE=" ~ v.auto_xy_v2_retry_available|default(0)|int ~ "; RETRY_USED=" ~ v.auto_xy_v2_retry_used|default(0)|int ~ ". " ~ detail ~ " REUSE_OPT_IN=" ~ reuse ~ ". Latched faults still require safe recovery and acknowledgement.")}

# RatOS order: capture intended mode -> reset temporary SINGLE -> heat bed -> bed heatsoak -> THIS HOOK -> internal post-bed
# preparation (including possible Beacon 170 C contact probing) -> bed mesh
# -> final hotend heat. Do not move back to _USER_START_PRINT_BED_MESH.
# Requires RatOS to have already homed xyz before bed heatsoak.
# This avoids waiting for the 170 C Beacon nozzle to cool to 155 C.
# The Klipper extra is a SYNCHRONOUS G-code command; failures raise a G-code
# error so the print does not advance to priming. Not a Moonraker shell macro.
# RatOS START_PRINT samples the requested IDEX mode, then temporarily calls
# _IDEX_SINGLE before reaching AFTER_HEATING_BED. Therefore we MUST latch
# the original carriage mode at this EARLIER hook, before the reset. The
# extension consumes the value exactly once at AFTER_HEATING_BED.
# Only independent IDEX with TOTAL_TOOLSHIFTS > 0 calibrates.
# Single-tool (zero toolshifts), COPY and MIRROR bypass without changing offsets or the Auto XY ON flag.
[gcode_macro _USER_START_PRINT]
description: Capture RatOS mode and slicer toolshift count (no motion)
gcode:
    AUTO_XY_CAPTURE_MODE TOTAL_TOOLSHIFTS={params.TOTAL_TOOLSHIFTS|default(0)|int} EXTRUDER_OTHER_LAYER_TEMP={params.EXTRUDER_OTHER_LAYER_TEMP|default('')}

[gcode_macro _USER_START_PRINT_AFTER_HEATING_BED]
description: AutoXY for dual-tool independent IDEX only; others bypass; before Beacon
gcode:
    AUTO_XY_GATE MODE=PRINT

# Optional manual commissioning after bed heatsoak, printer idle.
# Manual run requires temperature AND heater target within camera safety limits.
[gcode_macro AUTO_XY_RUN_NOW]
description: Manually run full Auto XY (requires ON, idle, homed, nozzles within preheat limits)
gcode:
    AUTO_XY_GATE MODE=IDLE

[gcode_macro AUTO_XY_ACKNOWLEDGE]
description: Clear fault AFTER manual verification of saved/runtime offsets and tool position
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("Cannot acknowledge an Auto XY fault during a print")}
    {% endif %}
    {% if printer["gcode_macro _VAOC"].is_started|default(false)|lower == "true" %}
        {action_raise_error("Cannot acknowledge fault: VAOC is still active. Recover/exit VAOC safely first.")}
    {% endif %}
    {% if printer.save_variables.variables.auto_xy_v2_retry_available|default(0)|int %}
        {action_raise_error("Active-VAOC retry token pending. Retry once or use AUTO_XY_RETRY_DISMISS and recover VAOC BEFORE acknowledging.")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=auto_xy_v2_fault VALUE=0
    SAVE_VARIABLE VARIABLE=auto_xy_v2_in_progress VALUE=0
    {action_respond_info("Auto XY fault acknowledged. This does NOT restore offsets. You must have already checked them.")}

# Historical standalone calibration retry UI. This is not the protected print
# hold/retry/resume controller. Protected original-print recovery is handled
# by the protected-print commands in this file and the extension.
# The extension checks the same active VAOC tool, exact pose, temperatures
# and unchanged verified saved offsets. It consumes ONE token before motion.
# A Klipper RESTART loses the in-memory position context; manual recovery then
# required. Do NOT acknowledge fault or exit VAOC before pressing Retry.
[gcode_macro AUTO_XY_RETRY_DISMISS]
description: Reject active-VAOC retry; keep fault latched and Auto XY OFF
gcode:
    SAVE_VARIABLE VARIABLE=auto_xy_v2_retry_available VALUE=0
    SAVE_VARIABLE VARIABLE=auto_xy_v2_enabled VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
    {action_respond_info("Auto XY retry dismissed, AUTO XY OFF. Recover/exit VAOC safely, check saved/runtime offsets, then acknowledge fault.")}

[gcode_macro AUTO_XY_RETRY_PROMPT]
description: Reopen one available in-VAOC retry prompt after failed print stops
gcode:
    {% set v = printer.save_variables.variables %}
    {% if not v.auto_xy_v2_retry_available|default(0)|int or v.auto_xy_v2_retry_used|default(0)|int %}
        {action_raise_error("No unused active-VAOC retry available")}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin Auto XY - active VAOC retry"
    RESPOND TYPE=command MSG="action:prompt_text This prompt applies only to a previously aborted calibration; automatic inline print retries do not need Mainsail confirmation."
    RESPOND TYPE=command MSG="action:prompt_text One retry is available IF old print is inactive and VAOC/tool/position/saved offsets are unchanged."
    RESPOND TYPE=command MSG="action:prompt_text Keep VAOC active. Do not move tools, acknowledge fault, or restart Klipper. If any safety check fails, recover manually."
    RESPOND TYPE=command MSG="action:prompt_button Retry calibration once (keep VAOC)|AUTO_XY_RETRY_ONCE|warning"
    RESPOND TYPE=command MSG="action:prompt_footer_button Keep Auto XY OFF|AUTO_XY_RETRY_DISMISS|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

# ---- Native camera-view commissioning helpers ----
# RatOS 2.1 V-Core 4 IDEX: manual commissioning aid ONLY.
# These G-code macros DO NOT make automatic offset changes or alter PRINT_START.
# They reuse the RatOS native fixed-VAOC positioning logic. Run with no print active.

[gcode_macro AUTO_XY_VIEW_START]
description: Enter RatOS fixed VAOC positioning mode (commissioning only)
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("AUTO_XY_VIEW_START requires printer idle")}
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("Home XYZ before starting VAOC XY measurements")}
    {% endif %}
    _VAOC_START

[gcode_macro AUTO_XY_VIEW_T0]
description: Position nozzle T0 at stored camera control point
gcode:
    {% if not printer["gcode_macro _VAOC"].is_started %}
        {action_raise_error("Run AUTO_XY_VIEW_START first")}
    {% endif %}
    _VAOC_LOAD_TOOL T=0

[gcode_macro AUTO_XY_VIEW_T1]
description: Position nozzle T1 at stored camera control point
gcode:
    {% if not printer["gcode_macro _VAOC"].is_started %}
        {action_raise_error("Run AUTO_XY_VIEW_START first")}
    {% endif %}
    _VAOC_LOAD_TOOL T=1

[gcode_macro AUTO_XY_VIEW_END]
description: Restore normal RatOS toolhead positions after image capture
gcode:
    {% if printer["gcode_macro _VAOC"].is_started %}
        _VAOC_END
    {% endif %}

# ---- Protected-print and recovery workflow ----
[gcode_macro AUTOXY_MODE_BRIDGE]
description: Internal RatOS IDEX mode captured before carriage reset.
variable_idex_mode: ''
gcode:
  { action_raise_error("AutoXY BRIDGE is not a standalone command") }

[gcode_macro AUTOXY_PRINT_PREPARE]
description: Start print procedure, use this in your Slicer.
variable_post_processor_version: 2       # internal use only. Do not touch!
variable_is_printing_gcode: False        # internal use only. Do not touch!
variable_both_toolheads: True            # internal use only. Do not touch!
variable_object_xoffset: 0               # internal use only. Do not touch!
variable_first_x: -1                     # internal use only. Do not touch!
variable_first_y: -1                     # internal use only. Do not touch!
variable_total_toolshifts: 0             # internal use only. Do not touch!
variable_initial_tool: 0                 # internal use only. Do not touch!
variable_extruder_first_layer_temp: ""   # internal use only. Do not touch!
variable_extruder_other_layer_temp: ""   # internal use only. Do not touch!
gcode:
	# mandatory parameter sanity check
	{% if params.EXTRUDER_TEMP is not defined %}
		_LED_START_PRINTING_ERROR
		{ action_raise_error("Missing START_PRINT parameter. EXTRUDER_TEMP parameter not found.")}
	{% endif %}
	{% if params.EXTRUDER_OTHER_LAYER_TEMP is not defined %}
		_LED_START_PRINTING_ERROR
		{ action_raise_error("Missing START_PRINT parameter. EXTRUDER_OTHER_LAYER_TEMP parameter not found.")}
	{% endif %}
	{% if params.BED_TEMP is not defined %}
		_LED_START_PRINTING_ERROR
		{ action_raise_error("Missing START_PRINT parameter. BED_TEMP parameter not found.")}
	{% endif %}
	{% if printer["gcode_macro RatOS"].auto_center_subject|default(false)|lower == 'true' and printer["gcode_macro RatOS"].danger_force_allow_auto_center_subject|default(false)|lower != 'true'%}
		# auto_center_subject needs careful review in the context of the recent move to use named_offsets, and also
		# alongside slicer profiles dedicated to IDEX mirror and copy mode (like the official Rat Rig profiles) that
		# already center the object on the build plate by emitting the appropriate X offset in the gcode.
		# For the time being, as this is an experimental-grade feature with no implied expectation of availability, 
		# the feature is disabled. Note that
		{ action_raise_error("The experimental auto_center_subject feature is not supported in this version of RatOS. Please disable it in the RatOS macro settings.") }
	{% endif %}

	# in case VAOC calibration is still active end it
	{% if "xyz" in printer.toolhead.homed_axes and printer["dual_carriage"] is defined and printer["gcode_macro _VAOC"] is defined %}
		{% if printer["gcode_macro _VAOC"].is_started|default(true)|lower == 'true' %}
			_VAOC_END
		{% endif %}
	{% endif %}

	# visual feedback
	_LED_START_PRINTING

	# cache toolhead settings
	CACHE_TOOLHEAD_SETTINGS KEY="start_print"

	# user START_PRINT hook
	_USER_START_PRINT { rawparams } 

	# get ratos settings
	{% set default_toolhead = printer["gcode_macro RatOS"].default_toolhead|default(0)|int %}
	{% set bed_heat_soak_time = printer["gcode_macro RatOS"].bed_heat_soak_time|default(0)|int %}
	{% set hotend_heat_soak_time = printer["gcode_macro RatOS"].hotend_heat_soak_time|default(0)|int %}
	{% set z_probe_stowable = printer["gcode_macro RatOS"].z_probe|lower == 'stowable' %}
	{% if printer["dual_carriage"] is defined %}
		{% set toolchange_standby_temp = printer["gcode_macro RatOS"].toolchange_standby_temp|default(-1)|float %}
	{% endif %}
	{% set z_speed = printer["gcode_macro RatOS"].macro_z_speed|float * 60 %}
	{% set printable_x_max = printer["gcode_macro RatOS"].printable_x_max|float %}

	# beacon contact config
	{% set beacon_contact_start_print_true_zero = true if printer["gcode_macro RatOS"].beacon_contact_start_print_true_zero|default(false)|lower == 'true' else false %}
	{% set beacon_contact_calibrate_model_on_true_zero = true if printer["gcode_macro RatOS"].beacon_contact_calibrate_model_on_true_zero|default(false)|lower == 'true' else false %}

	# beacon adaptive heat soak config
	{% set beacon_adaptive_heat_soak = true if printer["gcode_macro RatOS"].beacon_adaptive_heat_soak|default(false)|lower == 'true' else false %}
	{% set beacon_adaptive_heat_soak_min_wait = printer["gcode_macro RatOS"].beacon_adaptive_heat_soak_min_wait|default(0)|int %}
	{% set beacon_adaptive_heat_soak_max_wait = printer["gcode_macro RatOS"].beacon_adaptive_heat_soak_max_wait|default(5400)|int %}
	{% set beacon_adaptive_heat_soak_extra_wait_after_completion = printer["gcode_macro RatOS"].beacon_adaptive_heat_soak_extra_wait_after_completion|default(0)|int %}
	{% set beacon_adaptive_heat_soak_layer_quality = printer["gcode_macro RatOS"].beacon_adaptive_heat_soak_layer_quality|default(3)|int %}
	{% set beacon_adaptive_heat_soak_maximum_first_layer_duration = printer["gcode_macro RatOS"].beacon_adaptive_heat_soak_maximum_first_layer_duration|default(1800)|int %}

	# get macro parameters
	{% set X0 = params.X0|default(-1)|float %}
	{% set X1 = params.X1|default(-1)|float %}
	{% set Y0 = params.Y0|default(-1)|float %}
	{% set Y1 = params.Y1|default(-1)|float %}
	{% if first_x == -1 or first_y == -1 %}
		{% set first_x = params.FIRST_X|default(-1)|float %}
		{% set first_y = params.FIRST_Y|default(-1)|float %}
	{% endif %}
	{% set total_toolshifts = params.TOTAL_TOOLSHIFTS|default(0)|int %}
	{% set initial_tool = params.INITIAL_TOOL|default(default_toolhead)|int %}
	{% set start_chamber_temp = params.START_CHAMBER_TEMP|default(0)|int %}

	# -----------------------------------------------------------------------
	# IMPORTANT!!! TODO!!!
	# make sure IDEX chamber temps from the initial filament is getting used
	# slicer variable needs to be a array
	# make sure old slicer profiles are not affected
	{% set chamber_temp = params.CHAMBER_TEMP|default(0)|int %}
	{% set bed_temp = params.BED_TEMP|default(printer.heater_bed.target, true)|float %}
	# -----------------------------------------------------------------------

	{% set total_layer_count = params.TOTAL_LAYER_COUNT|default(0)|int %}
	{% set extruder_first_layer_temp = (params.EXTRUDER_TEMP|default("")).split(",") %}

	{% if printer.fastconfig.settings.beacon is defined %}
		_START_PRINT_PREFLIGHT_CHECK_BEACON_MODEL BEACON_CONTACT_START_PRINT_TRUE_ZERO={beacon_contact_start_print_true_zero} BEACON_CONTACT_CALIBRATE_MODEL_ON_TRUE_ZERO={beacon_contact_calibrate_model_on_true_zero}
	{% endif %}

	_START_PRINT_PREFLIGHT_CHECK_AND_RESET_BED_MESH BED_TEMP={bed_temp}
	
	# echo first print coordinates
	RATOS_ECHO MSG="First print coordinates X:{first_x} Y:{first_y}"

	# check for TOTAL_LAYER_COUNT parameter, important for beacon probe
	{% if params.TOTAL_LAYER_COUNT is not defined %}
		{% set link_url = "https://os.ratrig.com/docs/slicers" %}
		{% set link_text = "RatOS Slicer Configuration" %}
		{% set line_1 = '"Your slicer gcode settings are not up to date._N_Learn more about the <a href="%s" target="_blank" >%s</a>"' % (link_url, link_text) %}
		CONSOLE_ECHO TITLE="Incomplete Slicer Configuration detected" TYPE="warning" MSG={line_1}
	{% endif %}

	# update printer stats
	SET_PRINT_STATS_INFO CURRENT_LAYER=1
	SET_GCODE_VARIABLE MACRO=_ON_LAYER_CHANGE VARIABLE=layer_number VALUE=1
	{% if total_layer_count > 0 %}
		SET_PRINT_STATS_INFO TOTAL_LAYER={total_layer_count}
	{% endif %}

	# swap toolheads if needed
	{% if printer["dual_carriage"] is defined %}
		{% set swap_toolheads = true if printer["gcode_macro _IDEX_REMAP_TOOLHEADS"].enabled|default(false)|lower == 'true' else false %}
		{% if swap_toolheads %}
			{% set initial_tool = 0 if initial_tool == 1 else 1 %}
		{% endif %}
	{% endif %}

	# reset is_printing_gcode state
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=is_printing_gcode VALUE=False

	# update Frontend
	SET_GCODE_VARIABLE MACRO=T0 VARIABLE=active VALUE=True
	{% if printer["dual_carriage"] is defined %}
		SET_GCODE_VARIABLE MACRO=T1 VARIABLE=active VALUE=True
	{% endif %}

	# set both_toolheads variable based on toolshift count. we first assume both toolheads will be needed
	{% set both_toolheads = true %}
	{% if total_toolshifts == 0 %}
		{% set both_toolheads = false %}
	{% endif %}

	# IDEX mode
	{% set idex_mode = '' %}
	{% if printer["dual_carriage"] is defined %}
		{% set idex_mode = printer["dual_carriage"].carriage_1|lower %}
		{% set parking_position = printer["gcode_macro T%s" % default_toolhead].parking_position|float %}
		SET_GCODE_VARIABLE MACRO=AUTOXY_MODE_BRIDGE VARIABLE=idex_mode VALUE="'{idex_mode}'"
		_IDEX_SINGLE X={parking_position}
	{% endif %}
	{% if both_toolheads and (idex_mode == "copy" or idex_mode == "mirror") %}
		_LED_START_PRINTING_ERROR
		{ action_raise_error("Gcode tool changes found. Copy and mirror mode do not support toolchanges.")}
	{% endif %}
	{% if idex_mode == "copy" or idex_mode == "mirror" %}
		{% set both_toolheads = true %}
	{% endif %}

	# cache print variables
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=initial_tool VALUE={initial_tool}
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=first_x VALUE={first_x}
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=first_y VALUE={first_y}
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=total_toolshifts VALUE={total_toolshifts}
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=both_toolheads VALUE={both_toolheads}
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=extruder_first_layer_temp VALUE="'{params.EXTRUDER_TEMP}'"
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=extruder_other_layer_temp VALUE="'{params.EXTRUDER_OTHER_LAYER_TEMP}'"

	# reset toolshift counter
	{% if printer["dual_carriage"] is defined %}
		SET_GCODE_VARIABLE MACRO=_TOOLCHANGE VARIABLE=toolshift_count VALUE=0
	{% endif %}

	# load IDEX variable file
	{% if printer["dual_carriage"] is defined %}
		{% set svv = printer.save_variables.variables %}
	{% endif %}

	# IDEX toolhead x-offset sanity check
	{% if printer["dual_carriage"] is defined %}
		{% set parking_position_t0 = printer["gcode_macro T0"].parking_position|float %}
		{% set parking_position_t1 = printer["gcode_macro T1"].parking_position|float %}
		{% set stepper_x_position_min = printer.fastconfig.settings.stepper_x.position_min|float %}
		{% set stepper_x_position_endstop = printer.fastconfig.settings.stepper_x.position_endstop|float %}
		{% set dual_carriage_position_max = printer.fastconfig.settings.dual_carriage.position_max|float %}
		{% set dual_carriage_position_endstop = printer.fastconfig.settings.dual_carriage.position_endstop|float %}
		{% set x_parking_space = parking_position_t0 - (stepper_x_position_endstop , stepper_x_position_min)|max %}
		{% if dual_carriage_position_endstop < printable_x_max / 2.0 %}
			# Assume that T1 homes against T0, DC endstop position is not relevant for parking space calculation
			{% set dc_parking_space = dual_carriage_position_max - parking_position_t1 %}
		{% else %}
			{% set dc_parking_space = (dual_carriage_position_endstop , dual_carriage_position_max)|min - parking_position_t1 %}
		{% endif %}
		{% if svv.idex_xoffset|abs >= (x_parking_space - 0.5) or svv.idex_xoffset|abs >= (dc_parking_space - 0.5) %}
			_LED_START_PRINTING_ERROR
			{ action_raise_error("Toolhead x-offset is too high for the available parking space. Calibrate your X and DC endstop positions and make sure you stay below 1mm." % (copy_mode_max_width)) }
		{% endif %}
	{% endif %}

	# IDEX copy and mirror mode sanity check
	{% if (idex_mode == "copy" or idex_mode == "mirror") and printer.fastconfig.settings.ratos.enable_gcode_transform %}

		{% if params.MIN_X is not defined or params.MAX_X is not defined %}
			_LED_START_PRINTING_ERROR
			{ action_raise_error("Something went wrong! Missing important post processor start print parameter!") }
		{% endif %}

		# reset object xoffset
		SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=object_xoffset VALUE=0

		# ToDo!
		# get boundary box from slicer if already available on PS and SS
		{% set boundary_box_min_x = params.MIN_X|default(0)|float %}                 # params.MIN_X | bounding box value | post processor
		{% set boundary_box_max_x = params.MAX_X|default(printable_x_max)|float %}   # params.MAX_X | bounding box value | post processor

		# Take toolhead x offset into account
		{% set svv = printer.save_variables.variables %}

		{% if default_toolhead == 0 %}
			# T1 x-offset must be negative, its part of the sanity checks in the init macro
			{% set boundary_box_max_x = boundary_box_max_x + svv.idex_xoffset %}
		{% else %}
			# T0 x-offset must be positive, its part of the sanity checks in the init macro
			{% set boundary_box_min_x = boundary_box_min_x - svv.idex_xoffset %}
		{% endif %}

		{% set center_x = printable_x_max / 2.0 %}
		{% set safe_distance = printer.fastconfig.settings.dual_carriage.safe_distance|float %}
		{% set object_width = boundary_box_max_x - boundary_box_min_x %}
		{% set copy_mode_max_width = center_x %}
		{% set mirror_mode_max_width = center_x - safe_distance / 2.0 %}

		DEBUG_ECHO PREFIX="START_PRINT" MSG="OBJECT_WIDTH: {object_width} BOUNDARY_BOX_MIN_X: {boundary_box_min_x} BOUNDARY_BOX_MAX_X: {boundary_box_max_x} CENTER_X: {center_x} SAFE_DISTANCE: {safe_distance}"

		# object size sanity check
		{% if idex_mode == "copy" and object_width > copy_mode_max_width %}
			_LED_START_PRINTING_ERROR
			{ action_raise_error("Object is too big for copy mode! Max supported width is %s mm" % (copy_mode_max_width)) }
		{% endif %}
		{% if idex_mode == "mirror" and object_width > mirror_mode_max_width %}
			_LED_START_PRINTING_ERROR
			{ action_raise_error("Object is too big for mirror mode! Max supported width is %s mm" % (mirror_mode_max_width)) }
		{% endif %}

		# get object x-offset to center the object on the build plate
		{% if printer["gcode_macro RatOS"].auto_center_subject|default(false)|lower == 'true' %}
			{% set object_xoffset = (printable_x_max - boundary_box_max_x - boundary_box_min_x) / 2 %}
			SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=object_xoffset VALUE={object_xoffset}
		{% endif %}

	{% endif %}

	# filament detection in case user has filament sensors configured
	{% set has_initial_toolhead_filament_sensor = true if printer["filament_switch_sensor toolhead_filament_sensor_t%s" % initial_tool] is defined else false %}
	{% if has_initial_toolhead_filament_sensor %}
		# Initial toolhead filament sensor check 
		{% if printer["filament_switch_sensor toolhead_filament_sensor_t%s" % initial_tool].enabled|lower == "true" %}
			{% if printer["filament_switch_sensor toolhead_filament_sensor_t%s" % initial_tool].filament_detected|lower != "true" %}
				_LED_START_PRINTING_ERROR
				{ action_raise_error("Filament not detected! Toolhead T%s filament sensor is empty." % (initial_tool)) }
			{% endif %}
		{% endif %}
	{% endif %}
	{% set has_initial_bowden_filament_sensor = true if printer["filament_switch_sensor bowden_filament_sensor_t%s" % initial_tool] is defined else false %}
	{% if has_initial_bowden_filament_sensor %}
		# Initial toolhead bowden filament sensor check 
		{% if printer["filament_switch_sensor bowden_filament_sensor_t%s" % initial_tool].enabled|lower == "true" %}
			{% if printer["filament_switch_sensor bowden_filament_sensor_t%s" % initial_tool].filament_detected|lower != "true" %}
				_LED_START_PRINTING_ERROR
				{ action_raise_error("Filament not detected! Toolhead T%s bowden sensor is empty." % (initial_tool)) }
			{% endif %}
		{% endif %}
	{% endif %}
	{% if printer["dual_carriage"] is defined and both_toolheads %}
		# Secondary toolhead filament sensor check 
		{% set has_secondary_toolhead_filament_sensor = true if printer["filament_switch_sensor toolhead_filament_sensor_t%s" % (1 if initial_tool == 0 else 0)] is defined else false %}
		{% if has_secondary_toolhead_filament_sensor %}
			{% if printer["filament_switch_sensor toolhead_filament_sensor_t%s" % (1 if initial_tool == 0 else 0)].enabled|lower == "true" %}
				{% if printer["filament_switch_sensor toolhead_filament_sensor_t%s" % (1 if initial_tool == 0 else 0)].filament_detected|lower != "true" %}
					_LED_START_PRINTING_ERROR
					{ action_raise_error("Filament not detected! Toolhead T%s filament sensor is empty." % (1 if initial_tool == 0 else 0)) }
				{% endif %}
			{% endif %}
		{% endif %}
		# Secondary toolhead bowden filament sensor check 
		{% set has_secondary_bowden_filament_sensor = true if printer["filament_switch_sensor bowden_filament_sensor_t%s" % (1 if initial_tool == 0 else 0)] is defined else false %}
		{% if has_secondary_bowden_filament_sensor %}
			{% if printer["filament_switch_sensor bowden_filament_sensor_t%s" % (1 if initial_tool == 0 else 0)].enabled|lower == "true" %}
				{% if printer["filament_switch_sensor bowden_filament_sensor_t%s" % (1 if initial_tool == 0 else 0)].filament_detected|lower != "true" %}
					_LED_START_PRINTING_ERROR
					{ action_raise_error("Filament not detected! Toolhead T%s bowden sensor is empty." % (1 if initial_tool == 0 else 0)) }
				{% endif %}
			{% endif %}
		{% endif %}
	{% endif %}

	# chamber filter control
	_CHAMBER_FILTER_ON AT="before_print_start"

	# spool join
	{% if printer["dual_carriage"] is defined %}
		{% if printer["gcode_macro _IDEX_JOIN_SPOOLS"].enabled|default(false)|lower == 'true' %}
			{% if both_toolheads %}
				RATOS_ECHO MSG="Spool join is not possible if both toolheads are in use!"
				SET_GCODE_VARIABLE MACRO=_IDEX_JOIN_SPOOLS VARIABLE=enabled VALUE=False
			{% endif %}
		{% endif %}
	{% endif %}

	# reset toolhead offset
	{% if printer["dual_carriage"] is defined %}
		_SET_TOOLHEAD_OFFSET MOVE={1 if "xyz" in printer.toolhead.homed_axes else 0}
	{% endif %}

	# start 
	CLEAR_PAUSE                                # clear pause state
	{% if printer["gcode_macro RatOS"].force_absolute_position|lower == 'true' %}
		G90
	{% endif %}
	SAVE_GCODE_STATE NAME=start_print_state    # save gcode state

	# Metric values
	G21
	# Absolute positioning
	G90 
	# Set extruder to absolute mode
	M82
	_USER_START_PRINT_BEFORE_HOMING { rawparams }

	# handle stowable probe
	{% if z_probe_stowable == true %}
		STOWABLE_PROBE_BEGIN_BATCH
	{% endif %}

	# Home if needed
	MAYBE_HOME

	# Make sure we're clear of the bed
	_Z_HOP

	# move toolhead to the oozeguard if needed
	{% if idex_mode != '' and not (printer.fastconfig.settings.beacon is defined and (beacon_contact_start_print_true_zero or beacon_adaptive_heat_soak)) %}
		PARK_TOOLHEAD
	{% endif %}

	# heat chamber
	{% if chamber_temp > 0 %}
		{% if printer["fan_generic filter"] is defined %}
			{% if printer["gcode_macro RatOS"].chamber_heater_filter_fan_speed|default(0)|float > 0 %}
				SET_FAN_SPEED FAN=filter SPEED={printer["gcode_macro RatOS"].chamber_heater_filter_fan_speed|default(0)|float}
			{% endif %}
		{% endif %}
		_CHAMBER_HEATER_ON START_CHAMBER_TEMP={start_chamber_temp} CHAMBER_TEMP={chamber_temp}
		_USER_START_PRINT_HEAT_CHAMBER { rawparams } CHAMBER_TEMP={chamber_temp} 
	{% endif %}

	# Run the customizable "BEFORE_HEATING_BED" macro.
	_START_PRINT_BEFORE_HEATING_BED T={initial_tool} BOTH_TOOLHEADS={both_toolheads} IDEX_MODE={idex_mode}

	RATOS_ECHO MSG="Heating bed..."
	# Wait for bed to heat up
	M190 S{bed_temp}

	# Wait for bed thermal expansion
	{% if printer.fastconfig.settings.beacon is defined and beacon_adaptive_heat_soak %}
		_MOVE_TO_SAFE_Z_HOME
		# Must be close to bed for soaking and for beacon proximity measurements
		G1 Z2.5 F{z_speed}
		BEACON_WAIT_FOR_PRINTER_HEAT_SOAK LAYER_QUALITY={beacon_adaptive_heat_soak_layer_quality} MAXIMUM_FIRST_LAYER_DURATION={beacon_adaptive_heat_soak_maximum_first_layer_duration} MINIMUM_WAIT={beacon_adaptive_heat_soak_min_wait} MAXIMUM_WAIT={beacon_adaptive_heat_soak_max_wait}
		{% if beacon_adaptive_heat_soak_extra_wait_after_completion > 0 %}
			RATOS_ECHO MSG="Waiting for an additional {beacon_adaptive_heat_soak_extra_wait_after_completion} seconds after heat soak completion..."
			G4 P{(beacon_adaptive_heat_soak_extra_wait_after_completion * 1000)}
		{% endif %}
	{% else %}
		{% if bed_heat_soak_time > 0 %}
			RATOS_ECHO MSG="Heat soaking bed for {bed_heat_soak_time} seconds..."
			G4 P{(bed_heat_soak_time * 1000)}
		{% endif %}
	{% endif %}


[gcode_macro AUTOXY_PRINT_FINISH]
description: B4.4 continuation ONLY after guarded manual or auto VAOC.
gcode:
	# B4.4: load the saved preparation context, after the file-level guard.
	{% set default_toolhead = printer["gcode_macro RatOS"].default_toolhead|default(0)|int %}
	{% set hotend_heat_soak_time = printer["gcode_macro RatOS"].hotend_heat_soak_time|default(0)|int %}
	{% set beacon_contact_start_print_true_zero = true if printer["gcode_macro RatOS"].beacon_contact_start_print_true_zero|default(false)|lower == 'true' else false %}
	{% set z_probe_stowable = printer["gcode_macro RatOS"].z_probe|lower == 'stowable' %}
	{% set initial_tool = printer["gcode_macro START_PRINT"].initial_tool|int %}
	{% set both_toolheads = printer["gcode_macro START_PRINT"].both_toolheads|lower == 'true' %}
	{% set idex_mode = printer["gcode_macro AUTOXY_MODE_BRIDGE"].idex_mode|lower %}
	{% set act_idex_mode = idex_mode %}
	{% set toolchange_standby_temp = printer["gcode_macro RatOS"].toolchange_standby_temp|default(-1)|float %}
	{% set extruder_first_layer_temp = params.EXTRUDER_TEMP.split(',') %}
	{% set X0 = params.X0|default(-1)|float %}
	{% set X1 = params.X1|default(-1)|float %}
	{% set Y0 = params.Y0|default(-1)|float %}
	{% set Y1 = params.Y1|default(-1)|float %}
	{% set object_xoffset = printer["gcode_macro START_PRINT"].object_xoffset|float %}
	AUTOXY_PRINT_FINISH_GATE
	# Run the user created "AFTER_HEATING_BED" macro
	# AutoXY: native AutoXY hook replaced by separate guarded calibration gate

	# Run the customizable "AFTER_HEATING_BED" macro.
	_START_PRINT_AFTER_HEATING_BED T={initial_tool} BOTH_TOOLHEADS={both_toolheads} IDEX_MODE={idex_mode}

	# Run the user created "START_PRINT_BED_MESH" macro
	_USER_START_PRINT_BED_MESH { rawparams } X0={X0} X1={X1} Y0={Y0} Y1={Y1}

	# Run the customizable "BED_MESH" macro
	_START_PRINT_BED_MESH X0={X0} X1={X1} Y0={Y0} Y1={Y1} T={initial_tool} BOTH_TOOLHEADS={both_toolheads} IDEX_MODE={idex_mode}

	# handle stowable probe
	{% if z_probe_stowable == true %}
		STOWABLE_PROBE_END_BATCH
	{% endif %}

	# Start heating extruder
	{% if idex_mode == '' %}
		SET_HEATER_TEMPERATURE HEATER="extruder" TARGET={extruder_first_layer_temp[initial_tool]|float}
	{% else %}
		{% if initial_tool == 0 or both_toolheads or (default_toolhead == 0 and printer.fastconfig.settings.beacon is defined and beacon_contact_start_print_true_zero) %}
			SET_HEATER_TEMPERATURE HEATER="extruder" TARGET={extruder_first_layer_temp[0]|float}
		{% endif %}
		{% if initial_tool == 1 or both_toolheads or (default_toolhead == 1 and printer.fastconfig.settings.beacon is defined and beacon_contact_start_print_true_zero) %}
			SET_HEATER_TEMPERATURE HEATER="extruder1" TARGET={extruder_first_layer_temp[1]|float}
		{% endif %}
	{% endif %}

	# Run the users "PARK" macro
	_USER_START_PRINT_PARK { rawparams }

	# Run the customizable "PARK" macro
	_START_PRINT_PARK

	# Wait for extruder to heat up
	RATOS_ECHO MSG="Heating Extruder..."
	{% if idex_mode == '' %}
		TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={extruder_first_layer_temp[initial_tool]|float}  MAXIMUM={extruder_first_layer_temp[initial_tool]|float + 5}
	{% else %}
		{% if initial_tool == 0 or both_toolheads or (default_toolhead == 0 and printer.fastconfig.settings.beacon is defined and beacon_contact_start_print_true_zero) %}
			TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={extruder_first_layer_temp[0]|float}  MAXIMUM={extruder_first_layer_temp[0]|float + 5}
		{% endif %}
		{% if initial_tool == 1 or both_toolheads or (default_toolhead == 1 and printer.fastconfig.settings.beacon is defined and beacon_contact_start_print_true_zero) %}
			TEMPERATURE_WAIT SENSOR="extruder1" MINIMUM={extruder_first_layer_temp[1]|float}  MAXIMUM={extruder_first_layer_temp[1]|float + 5}
		{% endif %}
	{% endif %}

	# Wait for extruder thermal expansion
	{% if hotend_heat_soak_time > 0 %}
		RATOS_ECHO MSG="Heat soaking hotend for {hotend_heat_soak_time} seconds..."
		G4 P{(hotend_heat_soak_time * 1000)}
	{% endif %}

	# visual feedback
	{% if idex_mode == '' %}
		_LED_PRINTING
	{% else %}
		{% if idex_mode == "copy" or idex_mode == "mirror" %}
			_LED_PRINTING
		{% else %}
			{% if both_toolheads %}
				_LED_PRINTING TOOLHEAD={initial_tool}
				{% if toolchange_standby_temp > -1 %}
					_LED_TOOLHEAD_STANDBY TOOLHEAD={0 if initial_tool == 1 else 1}
				{% else %}
					_LED_PRINTING TOOLHEAD={0 if initial_tool == 1 else 1}
				{% endif %}
			{% else %}
				_LED_PRINTING TOOLHEAD={initial_tool}
				_LED_DEACTIVATE_TOOLHEAD TOOLHEAD={0 if initial_tool == 1 else 1}
			{% endif %}
		{% endif %}
	{% endif %}

	# Run the user created "AFTER_HEATING_EXTRUDER" macro.
	_USER_START_PRINT_AFTER_HEATING_EXTRUDER { rawparams } X0={X0} X1={X1} Y0={Y0} Y1={Y1}

	# Run the customizable "AFTER_HEATING_EXTRUDER" macro.
	_START_PRINT_AFTER_HEATING_EXTRUDER X0={X0} X1={X1} Y0={Y0} Y1={Y1} INITIAL_TOOLHEAD={initial_tool} BOTH_TOOLHEADS={both_toolheads} IDEX_MODE={idex_mode}

	# cool down the preheated probing toolhead if not needed for printing
	{% if idex_mode != '' %}
		{% if not both_toolheads %}
			{% if initial_tool != default_toolhead %}
				SET_HEATER_TEMPERATURE HEATER={'extruder' if default_toolhead == 0 else 'extruder1'} TARGET=0
			{% endif %}
		{% endif %}
	{% endif %}

	# put toolhead into standby mode if configured
	{% if idex_mode != '' %}
		# Reset standby flags to ensure consistent state
		SET_GCODE_VARIABLE MACRO=T0 VARIABLE=standby VALUE=False
		SET_GCODE_VARIABLE MACRO=T1 VARIABLE=standby VALUE=False

		{% if idex_mode != "copy" and idex_mode != "mirror" %}
			{% if toolchange_standby_temp > -1 %}
				SET_HEATER_TEMPERATURE HEATER={'extruder' if initial_tool == 1 else 'extruder1'} TARGET={toolchange_standby_temp}
				SET_GCODE_VARIABLE MACRO=T{0 if initial_tool == 1 else 1} VARIABLE=standby VALUE=True
			{% endif %}
		{% endif %}
	{% endif %}

	# restore gcode state
	RESTORE_GCODE_STATE NAME=start_print_state

	{% if printer["dual_carriage"] is defined %}
		_SET_IDEX_MODE_OFFSET
	{% endif %}

	# restore IDEX mode
	{% if idex_mode != '' %}
		{% if idex_mode == "copy" or idex_mode == "mirror" %}
			{% if idex_mode == "copy" and idex_mode != act_idex_mode %}
				_IDEX_COPY DANCE=0
			{% elif idex_mode == "mirror" and idex_mode != act_idex_mode %}
				_IDEX_MIRROR DANCE=0
			{% endif %}
			# adjust object x-offset
			{% if printer["gcode_macro RatOS"].auto_center_subject|default(false)|lower == 'true' %}
				RATOS_ECHO MSG="Adjusting object x-offset by {(object_xoffset)} mm"
				SET_GCODE_OFFSET X_ADJUST={object_xoffset} MOVE=0
			{% endif %}
		{% else %}
			_SELECT_TOOL T={initial_tool} TOOLSHIFT=false
			_SET_TOOLHEAD_OFFSET
		{% endif %}		
	{% endif %}

	# set nozzle thermal expansion offset and restore runtime offset
	{% if printer.fastconfig.settings.beacon is defined %}
		_BEACON_SET_NOZZLE_TEMP_OFFSET
	{% endif %}

	# Set extrusion mode based on user configuration
	_SET_EXTRUSION_MODE

	# set is_printing_gcode state
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=is_printing_gcode VALUE=True

	# set initial toolchange timestamp
	{% if printer["gcode_macro _SELECT_TOOL"] is defined %}
		SET_GCODE_VARIABLE MACRO=_SELECT_TOOL VARIABLE=last_timestamp VALUE={printer["print_stats"].print_duration}
	{% endif %}

	# user END_START_PRINT hook
	_USER_END_START_PRINT { rawparams } 

	G92 E0    # reset extrusion distance

	# chamber filter control
	_CHAMBER_FILTER_ON AT="after_print_start"

	_ALERT_NON_ZERO_Z_OFFSET
	
	RATOS_ECHO MSG="Printing..."


#####
# START PRINT MACRO HOOKS
