# RC16 Mainsail nozzle maintenance. Native VAOC handles all movement.
# Capture/publish are asynchronous; check STATUS before repeating or finishing.
[gcode_macro AUTO_XY_RECOMMISSION_NOZZLES]
description: Recommission T0/T1 camera references through native RatOS VAOC
gcode:
    AUTOXY_RECOMMISSION_BEGIN
    _VAOC_START

[gcode_macro AUTO_XY_RECOMMISSION_T0]
description: Move T0 to native camera station for recommissioning
gcode:
    {% if printer["auto_xy_recommission_rc16"].phase != "STARTING" %}
        _VAOC_LOAD_TOOL T=0
    {% endif %}
    AUTOXY_RECOMMISSION_POSITIONED TOOL=0

[gcode_macro AUTO_XY_RECOMMISSION_CAPTURE_T0]
description: Capture three full camera frames for positioned T0
gcode:
    AUTOXY_RECOMMISSION_CAPTURE TOOL=0

[gcode_macro AUTO_XY_RECOMMISSION_T1]
description: Move T1 to native camera station for recommissioning
gcode:
    _VAOC_LOAD_TOOL T=1
    AUTOXY_RECOMMISSION_POSITIONED TOOL=1

[gcode_macro AUTO_XY_RECOMMISSION_CAPTURE_T1]
description: Capture three full camera frames for positioned T1
gcode:
    AUTOXY_RECOMMISSION_CAPTURE TOOL=1

[gcode_macro AUTO_XY_RECOMMISSION_SAVE]
description: Validate both nozzle image sets and replace references after manual VAOC
gcode:
    AUTOXY_RECOMMISSION_PUBLISH CONFIRM=1

[gcode_macro AUTO_XY_RECOMMISSION_FINISH]
description: Close native VAOC after successfully saved nozzle references
gcode:
    AUTOXY_RECOMMISSION_FINISH
    _VAOC_END

[gcode_macro AUTO_XY_RECOMMISSION_CANCEL]
description: Cancel incomplete recommission; preserve old reference profile
gcode:
    AUTOXY_RECOMMISSION_CANCEL
    {% if printer["gcode_macro _VAOC"].is_started %}
        _VAOC_END
    {% endif %}

[gcode_macro AUTO_XY_RECOMMISSION_STATUS]
description: Show recommissioning progress and missing image sets
gcode:
    AUTOXY_RECOMMISSION_STATUS
