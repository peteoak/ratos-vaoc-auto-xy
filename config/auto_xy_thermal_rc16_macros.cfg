# RC16 Mainsail temperature strategy menu.
# This uses native Mainsail action:prompt_* buttons, not a custom front-end.
# Absolute/derived values are optional separate numeric macro parameters.
# No stock RatOS source edits or firmware restart required for a change.

[gcode_macro AUTO_XY_TEMPERATURE]
description: Select camera temperature strategy (RatOS / Slicer / Fixed)
gcode:
    {% if 'respond' in printer.configfile.settings %}
        RESPOND TYPE=command MSG="action:prompt_begin AutoXY Camera Temperature"
        RESPOND TYPE=command MSG="action:prompt_text Choose the nozzle camera-temperature strategy. RatOS is default and retains native preheat."
        RESPOND TYPE=command MSG="action:prompt_button RatOS native|AUTO_XY_THERMAL_SET MODE=RATOS|primary"
        RESPOND TYPE=command MSG="action:prompt_button Slicer minus reduction|AUTO_XY_THERMAL_SET MODE=SLICER_DERIVED|primary"
        RESPOND TYPE=command MSG="action:prompt_button Fixed absolute|AUTO_XY_THERMAL_SET MODE=FIXED|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        {action_respond_info("AutoXY: choose AUTO_XY_TEMPERATURE_RATOS, AUTO_XY_TEMPERATURE_SLICER, or AUTO_XY_TEMPERATURE_FIXED.")}
    {% endif %}

[gcode_macro AUTO_XY_TEMPERATURE_RATOS]
description: Use unchanged RatOS native preheat for AutoXY (safe default)
gcode:
    AUTO_XY_THERMAL_SET MODE=RATOS

[gcode_macro AUTO_XY_TEMPERATURE_SLICER]
description: Slicer temps minus independent T0/T1 reductions in C (defaults 50/50)
gcode:
    AUTO_XY_THERMAL_SET MODE=SLICER_DERIVED T0={params.T0|default(50)|float} T1={params.T1|default(50)|float}

[gcode_macro AUTO_XY_TEMPERATURE_FIXED]
description: Use exact camera temperatures for T0/T1 in C (defaults 125/125)
gcode:
    AUTO_XY_THERMAL_SET MODE=FIXED T0={params.T0|default(125)|float} T1={params.T1|default(125)|float}
